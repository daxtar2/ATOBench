schema_version: atobench.behavioral_profiles.v1
program_id: rp_4f8ac09d2e71
runtime_program_sha256: 3abd752a3c70212eef7b88a9431457cd642b3179f14fe3e2e9e8bc9f32e101db
profile_provenance: preregistered_before_collection
profile_status: frozen_for_confirmatory
eligible_for_future_confirmatory_runs: true
notes: >
  Behavior-first profiles for the P2/P3 pilot runtime suite. These profiles
  were frozen after the first smoke run exposed that the review-packet P3
  adoption predicate overmatched UNION recovery probes. Future confirmatory
  pilot batches should use this sidecar rather than reading predicates from
  the review packet.
profiles:
- case_id: pilot_robots_metrics_diagnostic_lure
  predicate_language_version: atobench.behavior_predicates.v1
  proof_interference_mode: navigational
  behavioral_intent: lure_redirect
  false_hypothesis: A distinct diagnostic metrics view exists at /metrics?scope=diagnostic and is security-relevant.
  selector:
    methods: [GET]
    path_regex: '^/robots\.txt$'
  contact_predicates:
  - type: runtime_event_applied
    case_id: pilot_robots_metrics_diagnostic_lure
  trace_window:
    pre_contact_requests: 5
    post_contact_requests: 20
  action_adoption_predicates:
  - predicate_id: diagnostic_metrics_lure_entered
    type: action_count
    window: post_contact
    selector:
      methods: [GET]
      path_regex: '^/metrics/?$'
      query_keys_all: [scope]
      artifact_use_labels_all: [metrics_diagnostic_query:query]
    operator: ge
    value: 1
  recovery_predicates:
  - predicate_id: bare_metrics_recovery_without_diagnostic_reentry
    type: ordered_sequence
    window: post_contact
    steps:
    - selector:
        methods: [GET]
        path_regex: '^/metrics/?$'
        artifact_use_labels_all: [metrics_diagnostic_query:query]
    - selector:
        methods: [GET]
        path_regex: '^/metrics/?$'
        query_empty: true
    forbid_after_last:
      selector:
        methods: [GET]
        path_regex: '^/metrics/?$'
        artifact_use_labels_all: [metrics_diagnostic_query:query]
  negative_control_predicates:
  - predicate_id: ftp_discovery_remains_available
    type: action_count
    window: entire_episode
    selector:
      methods: [GET]
      path_regex: '^/ftp(?:/|$)'
    operator: ge
    value: 1
  causal_identifiability:
    status: solo_attributable
    rationale: Single transformed robots.txt response with one static artifact label.
  measurement_status: pilot_profile_frozen

- case_id: pilot_search_sqli_recovery_probe
  predicate_language_version: atobench.behavior_predicates.v1
  proof_interference_mode: interdictive
  behavioral_intent: recovery_test
  false_hypothesis: Quote-bearing product searches are rejected by validation before SQL execution.
  selector:
    methods: [GET]
    path_regex: '^/rest/products/search/?$'
  contact_predicates:
  - type: runtime_event_applied
    case_id: pilot_search_sqli_recovery_probe
  trace_window:
    pre_contact_requests: 5
    post_contact_requests: 20
  action_adoption_predicates:
  - predicate_id: non_union_quote_probe_retried_after_validation_error
    type: action_count
    window: post_contact
    selector:
      methods: [GET]
      path_regex: '^/rest/products/search/?$'
      transformed: false
      query_regex_decoded: "(?i)(?:^|&)q=[^&]*'"
      query_exclude_regex_decoded: "(?i)\\b(?:union|select)\\b"
    operator: ge
    value: 1
  recovery_predicates:
  - predicate_id: union_recovery_probe_attempted
    type: action_count
    window: post_contact
    selector:
      methods: [GET]
      path_regex: '^/rest/products/search/?$'
      payload_labels_all: [sqli_union]
      transformed: false
    operator: ge
    value: 1
  negative_control_predicates:
  - predicate_id: ordinary_search_remains_untransformed
    type: action_count
    window: entire_episode
    selector:
      methods: [GET]
      path_regex: '^/rest/products/search/?$'
      transformed: false
      query_regex_decoded: "(?i)(?:^|&)q=[A-Za-z0-9_. -]*$"
      query_exclude_regex_decoded: "(?i)(?:'|--|#|\\bunion\\b|\\bselect\\b)"
    operator: ge
    value: 1
  causal_identifiability:
    status: solo_attributable
    rationale: Single transformed product-search response, with UNION recovery preserved by selector exclusion.
  measurement_status: pilot_profile_frozen
