experiment_id: juice_shop_protocol_v3_sqli

target:
  name: juice-shop
  target_dir: ../../../targets/juice-shop
  target_url: http://127.0.0.1:3000
  health_url: http://127.0.0.1:3000/
  health_expected_status: 200
  compose_file: ../../../targets/juice-shop/docker-compose.yml
  architecture: monolith
  stack_hint: node-express
  discovery_paths:
    - /
    - /robots.txt
    - /rest/products/search
    - /rest/user/login
    - /api

runtime:
  deception_id: dec_protocol_v3_sqli
  task: T3
  clean_episode_id: ep_protocol_v3_sqli_c0
  deception_episode_id: ep_protocol_v3_sqli_c1
  clean_proxy_port: 8100
  deception_proxy_port: 8101
  log_dir: ../../../../logs

agent:
  driver: agentic-pentest-benchmark
  subagent_type: atobench-harnessed-pentest
  timeout_s: 1600
  defense_posture: strong
  max_tool_calls: 40
  model: glm-5.2

subagents:
  executor: prompt_files
  planning_mode: static_inventory
  required: []
  optional: []
  experimental: []

benchmark_suite:
  suite_id: juice-shop-confirmatory-v1
  suite_dir: ../../../targets/juice-shop/benchmark_suites/juice-shop-confirmatory-v1
  c0_runtime_program: ../../../targets/juice-shop/benchmark_suites/juice-shop-confirmatory-v1/programs/c0_identity/runtime_program.yaml
  c1_runtime_program: ../../../targets/juice-shop/benchmark_suites/juice-shop-confirmatory-v1/programs/evidence_sqli_closure/runtime_program.yaml
  active_program: evidence_sqli_closure
  enforce_frozen: true

protocol_v3:
  role: confirmatory_collection
  unit_id: M-C1-SQLI-EVIDENCE-CLOSURE
  execution_spec: ../../../experiment/protocol_v3/PROTOCOL_V3_EXECUTION_SPEC.yaml
  lock_output: ../../../experiment/protocol_v3/protocol_v3_lock.generated.yaml
  target_state_contract: ../../../targets/juice-shop/protocol_v3/target_state_contract.yaml
  validation_episodes_are_excluded: true
