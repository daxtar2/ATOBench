services:
  change-approval:
    build: ./app
    ports:
      - "18080:8080"
    volumes:
      - change_data:/data
    environment:
      DATA_DIR: /data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  change_data:
