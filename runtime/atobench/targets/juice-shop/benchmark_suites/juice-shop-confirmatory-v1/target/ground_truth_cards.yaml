  - 3-stars/login_jim.md
  difficulty: 2
  endpoint: /rest/user/login
  method: POST
  vuln: SQL Injection
  vuln_class: sqli
  severity: critical
  expected_detection: true
  benchmark_use: primary
  evidence_hint: Tautology payload in the email field, e.g. ' OR true-- or admin@juice-sh.op' OR '1'='1' --, returns
    an authenticated JWT.
  match_notes: Normalize findings against POST /rest/user/login and SQLi/auth-bypass language.
