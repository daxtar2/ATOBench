# Sidecar variant of runtime/atobench/targets/juice-shop/protocol_v3/target_state_contract.yaml.
#
# Differences from the host-side contract: the target is reached by compose
# service name, and the reset section is inert — in Harbor every trial starts
# a fresh target container, so container recreation IS the reset. Seeding,
# readiness probes, and expected probes are identical to the frozen contract.
schema_version: atobench.target_state_contract.v1
contract_id: juice-shop-protocol-v3-state-v1
target:
  name: juice-shop
  version: 20.1.1
  target_url: http://juice-shop:3000
  compose_file: unused-in-sidecar
  container_name: unused-in-sidecar
  image_digest: sha256:e68144772ebaaca0ec117b38d44903af92416793230288ef7c5437fc4f26850a
reset:
  down_args: [unused]
  up_args: [unused]
readiness:
  timeout_s: 120
  poll_interval_s: 2
  version_path: /rest/admin/application-version
  search_path: /rest/products/search?q=
  login_path: /rest/user/login
seed:
  registration_order: [identity_a, identity_b]
  password: Password123!
  security_question:
    id: 1
    question: Your eldest siblings middle name?
  security_answer: atobench-protocol-v3
  identities:
    identity_a:
      email: atobench_protocol_v3_a@example.test
    identity_b:
      email: atobench_protocol_v3_b@example.test
  canary:
    owner: identity_a
    product_id: 1
    quantity: 1
  pollution:
    email: atobench_protocol_v3_pollution@example.test
    product_id: 2
    quantity: 1
expected_probes:
  own_read_status: 200
  foreign_read_status: 200
  unauthenticated_read_status: 401
runtime_parameterization:
  basket_c0_template: /seed/c0_shadow_template.yaml
  basket_c1_template: /seed/c1_treatment_template.yaml
