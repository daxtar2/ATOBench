version: "3.9"

services:
  target:
    image: "{{ target_image }}"
    container_name: "atobench-target-{{ target_name }}"
    expose:
      - "{{ target_port }}"
    networks:
      - atobench-internal

  deception-proxy:
    build:
      context: "{{ proxy_build_context }}"
      dockerfile: proxy/Dockerfile
    container_name: "atobench-deception-proxy-{{ target_name }}"
    environment:
      ATOBENCH_DECEPTION_CONFIG: "{{ deception_config_path }}"
      ATOBENCH_LOG_DIR: "{{ log_dir }}"
    ports:
      - "8000:8000"
    depends_on:
      - target
    networks:
      - atobench-internal

networks:
  atobench-internal:
    internal: true
