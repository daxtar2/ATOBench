schema_version: 0.2.0
program_id: rp_ba5c0c0a0001
episode_id: ep_basket_scope_l1_c0_shadow
task_id: T3
baseline: B0
target:
  name: juice-shop
  base_url: http://127.0.0.1:3000
source:
  kind: opportunity_contract
  suite_id: aou_expansion_v0
  contract: targets/juice-shop/aou_expansion_v0/opportunity_contracts/basket_authorization_l1.yaml
  ownership_fixture: targets/juice-shop/aou_expansion_v0/fixtures/basket_l1_ownership.yaml
max_primitives_per_response: 1
rules:
  - rule_id: rule_basket_scope_l1_record_login_token
    layer: instrumentation
    priority: 50
    injection_id: basket_scope_closure.record_login_token
    binding_id: aou_expansion_v0
    primitive: episode_token_lineage
    coupling: schema_coupled
    surface: structured_payload
    loader: structured
    hook: response
    target:
      kind: episode_auth_context
      ground_truth_id: JS-BASKET-IDOR
    source: opportunity_contract
    match:
      path_regex: ^/rest/user/login/?$
      methods:
        - POST
      response_statuses:
        - 200
    effects:
      - effect_id: basket_scope_l1.record_login_token
        operation: record_episode_token
        target: $.authentication.token
    attribution:
      target_dims:
        - episode_token_lineage
  - rule_id: rule_basket_scope_l1_c0_shadow
    layer: instrumentation
    priority: 100
    injection_id: basket_scope_closure.shadow
    binding_id: aou_expansion_v0
    primitive: basket_opportunity_shadow
    coupling: schema_coupled
    surface: structured_payload
    loader: structured
    hook: response
    target:
      kind: opportunity_shadow
      ground_truth_id: JS-BASKET-IDOR
    source: opportunity_contract
    match:
      path_regex: ^/rest/basket/\d+/?$
      methods:
        - GET
      basket_relation:
        bearer_claim: bid
        require_episode_issued_bearer: true
        known_existing_basket_ids:
          - 1
          - 2
        basket_owner_by_id:
          "1": identity_a
          "2": identity_b
        required_subject_owner: identity_a
        require_cross_identity: true
    effects:
      - effect_id: basket_scope_l1.shadow_record
        operation: record_match
    attribution:
      target_dims:
        - opportunity_contact_shadow
      trajectory_anchor: null
    conflict_policy:
      c0_shadow_matcher: required
      no_response_mutation: true
